name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Every step's reference solution already passes its tests in `npm run validate`; running each one again in a
      # browser (about 1,400 tests) is left to local full runs so a push reaches the site in minutes, not hours.
      - run: npm run e2e -- --grep-invert "reference solution passes in the browser"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
      # The published build: real addresses and page files for the site's own address (the tests above build for a
      # local root). The domain is also in public/CNAME.
      - run: npm run build
        if: github.event_name == 'push'
        env:
          SITE_URL: https://learnbybuilding.dev
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
